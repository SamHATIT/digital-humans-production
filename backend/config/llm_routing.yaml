# LLM Router Configuration — Digital Humans Platform
# Multi-profile routing with 2 logical tiers (orchestrator / worker).
#
# Updated: 2026-04-25 — Migration Opus 4.6 → 4.7, Sonnet 4.5 → 4.6, pricing Opus.
#   - claude-opus.model_id   : claude-opus-4-6 → claude-opus-4-7
#   - claude-sonnet.model_id : claude-sonnet-4-5-20250929 → claude-sonnet-4-6
#   - pricing/anthropic/claude-opus: $15/$75 → $5/$25 (était obsolète, vrai prix
#     Anthropic 2026 pour Opus 4.x = $5/$25, vérifié sur docs.claude.com).
#   - Pas de changement pricing Sonnet/Haiku (Sonnet 4.6 reste à $3/$15).
#
# Updated: 2026-04-18 — Agent C (session3) :
#   - Consolidation vers 2 tiers logiques : orchestrator (Opus-class) / worker (Sonnet-class).
#   - Support 3 deployment profiles : cloud / on-premise / freemium.
#   - Source de vérité unique : ce fichier YAML remplace ANTHROPIC_MODELS/OPENAI_MODELS/AGENT_TIER_MAP hardcodés.
#   - Pricing réel consommé par budget_service.py (plus de MODEL_PRICING hardcodé).
#
# Résout findings : N21, N22, N23, N28, N31, N33, N35, N41, N42, N43, N45, N86.
#
# Updated: 2026-05-31 (mod38) — Opus 4.7 → 4.8 (claude-opus-4-8, sorti 28-05, vérifié via /v1/models).
#
# Profile actif : sélectionné via env var DH_DEPLOYMENT_PROFILE (default: cloud).

active_profile: "${DH_DEPLOYMENT_PROFILE}"   # cloud | on-premise | freemium — defaults to "cloud" if unset
default_profile: "cloud"

# =============================================================================
# Agent tier mapping — agent_type → logical tier (orchestrator | worker)
# Source de vérité unique. Aliases (code agent_type + display name) listés pour
# tolérer les deux conventions utilisées historiquement dans le codebase.
# =============================================================================
agent_tier_map:
  # Orchestrator tier — reasoning lourd, synthèse, design
  pm:                 orchestrator   # Sophie
  pm_orchestrator:    orchestrator   # Sophie (alias)
  sophie:             orchestrator   # Sophie (display)
  architect:          orchestrator   # Marcus
  solution_architect: orchestrator   # Marcus (alias)
  marcus:             orchestrator   # Marcus (display)
  ba:                 orchestrator   # Olivia — UCs demandent Opus (décision CRIT-02)
  business_analyst:   orchestrator   # Olivia (alias)
  olivia:             orchestrator   # Olivia (display)
  research:           orchestrator   # Emma — synthèse SDS
  research_analyst:   orchestrator   # Emma (alias)
  emma:               orchestrator   # Emma (display)

  # Worker tier — exécution spécialisée, outputs longs mais moins de raisonnement abstrait
  apex:               worker
  apex_developer:     worker
  developer_apex:     worker
  diego:              worker
  lwc:                worker
  lwc_developer:      worker
  developer_lwc:      worker
  zara:               worker
  admin:              worker
  sf_admin:           worker
  raj:                worker
  qa:                 worker
  qa_tester:          worker
  elena:              worker
  devops:             worker
  jordan:             worker
  data:               worker
  data_migration:     worker
  aisha:              worker
  trainer:            worker
  lucas:              worker

# =============================================================================
# Deployment profiles — chaque profile mappe chaque tier vers un provider/model.
# Format : profiles.<profile>.<tier> = "<provider>/<model_alias>"
# Le model_alias doit exister dans providers.<provider>.models.
# =============================================================================
# =============================================================================
# Plafonds de sortie — ajoutes le 23/08/2026
# =============================================================================
# Ils vivaient dans le code, alors que le routage de modele vit ici : le tier
# venait de ce fichier, le plafond du code, et rien ne verifiait leur
# coherence. Meme famille que les 52 chemins absolus du P2.
#
# Trois defauts se superposaient sans se connaitre :
#   LLMRequest.max_tokens        = 4096
#   llm_service, trois chemins   = 16000
#   sites d'appel                = 500, 1500, 2000, 32000
# Lequel s'appliquait dependait du chemin emprunte.
#
# La diversite des valeurs est VOULUE : 500 pour une classification et 32000
# pour la redaction d'un SDS sont deux taches sans rapport. Les uniformiser
# serait une erreur. Ce qui change, c'est qu'elles sont lisibles au meme
# endroit que la decision de modele.
#
# Ordre de resolution : par_agent > par_tier > defaut.
max_tokens:
  defaut: 16000

  par_tier:
    orchestrator: 32000   # raisonnement long, synthese, design
    worker:       16000   # execution specialisee, sorties longues

  # Surcharge par AGENT. Toute cle doit exister dans agent_tier_map, sinon
  # l'entree est morte et ne s'appliquera jamais — verifie au demarrage.
  par_agent:
    # Redaction du SDS — un seul appel en flux, plus de troncature ni de
    # raccords (STREAM-001). C'est le plafond le plus haut du systeme.
    emma:               32000
    research:           32000
    research_analyst:   32000

    # Marcus produit l'architecture en quatre appels ; chacun peut etre long.
    marcus:             32000
    architect:          32000
    solution_architect: 32000

  # Surcharge par SITE D'APPEL. Ce ne sont PAS des agents : ils n'ont pas de
  # fiche, pas de tier, et n'apparaissent pas dans agent_tier_map. Les melanger
  # aux agents rendrait les entrees invisibles au controle de coherence.
  par_contexte:
    # Chat et concierge : reponses courtes, latence visible par l'utilisateur.
    sophie_chat:             1500
    sophie_concierge:        1500

    # Demandes de changement : redaction courte, puis classification.
    change_request:          2000
    change_request_classify:  500

    # Validation humaine dans la boucle : commentaire court.
    hitl:                    1500

profiles:

  # --- Profile 1 : cloud (production VPS) ---
  # Anthropic pour tout, pas de Ollama. BUILD activé.
  # Profile par défaut pour les tiers Team et Enterprise (et dev).
  cloud:
    build_enabled: true
    orchestrator: "anthropic/claude-opus"
    worker:       "anthropic/claude-sonnet"
    fallback_chain: {}   # mod38 : aucun fallback cross-modele en cloud — une panne LLM remonte en erreur franche (pas de degradation silencieuse vers Sonnet/Haiku)

    # Tier-based overrides — appliqués UNIQUEMENT quand subscription_tier
    # est passé dans le LLMRequest (sera branché en Phase 3 backend, en
    # même temps que le wiring Stripe + propagation tier user → request).
    #
    # Décision actée 29 avril 2026 : pour le tier Pro 49€, Marcus reste en
    # Opus (vitrine technique du SDS, agent le plus scruté par les clients
    # Salesforce techies — 56 % du coût SDS à lui seul). Les 3 autres
    # orchestrators (Sophie/Olivia/Emma) passent en Sonnet sur Pro.
    #
    # Les autres tiers (free, team, enterprise) ne sont pas listés ici car
    # ils utilisent les mappings tier→provider standard sans override agent-level.
    tier_overrides:
      # Free tier (8 juin) — Sophie/Olivia en Sonnet : jamais Opus, jamais Haiku.
      # Opus est reserve aux tiers PAYANTS (Pro et au-dessus). Maitrise des couts demo publique.
      free:
        orchestrator_default: "anthropic/claude-sonnet"
        # worker deja en Sonnet via le mapping cloud standard
      pro:
        # Par défaut : tous les orchestrators tournent en Sonnet pour le tier Pro
        orchestrator_default: "anthropic/claude-sonnet"
        # Sauf agents listés ici qui gardent leur mapping standard (Opus)
        agents_keep_orchestrator:
          # Tous les aliases Marcus / Solution Architect — vitrine technique du SDS,
          # 56% du coût SDS, le SaaS Pro 49€ doit garder Opus ici sinon la
          # qualité du livrable se dégrade. Les autres orchestrators (Sophie/
          # Olivia/Emma) tournent en Sonnet pour ce tier (downgrade contrôlé).
          - marcus
          - architect
          - solution_architect
        # Worker tier inchangé (Sonnet)

  # --- Profile 2 : on-premise (client airgapped) ---
  # Ollama local pour tout. AUCUN fallback cloud (confidentialité).
  # Si local/mixtral down, l'erreur remonte telle quelle à l'utilisateur.
  # ═══════════════════════════════════════════════════════════════════════
  # PROFIL DE TEST — NE JAMAIS UTILISER AVEC UN VRAI CLIENT
  # ═══════════════════════════════════════════════════════════════════════
  # Ajoute le 10/08/2026 a la demande de Sam : « mets toute l'equipe du debut
  # a la fin afin de tous les tester, on ne va pas tous les migrer mais juste
  # pour les tests ».
  #
  # POURQUOI C'EST LEGITIME ICI : le projet de test (108) tourne sur l'org de
  # DEVELOPPEMENT de Sam, sans aucune donnee client. La regle qui protege
  # Sophie, Olivia, Emma, Marcus, Jordan et Aisha vise la PRODUCTION avec de
  # vrais clients — pas un test interne.
  #
  # POURQUOI IL FAUT LE DIRE ICI : pour que personne ne prenne ce reglage
  # pour un reglage de production. En production, les agents exposes aux
  # donnees clients restent sur API (arbitrage Sam du 09/08), et le serveur
  # GPU est en Californie.
  #
  # GARDE-FOU : ce profil ne doit etre actif que si le projet cible porte un
  # marqueur non-production. A verifier avant chaque usage.
  test_gpu_complet:
    build_enabled: true
    # Les noms doivent correspondre aux cles enregistrees par le routeur :
    # gpu_gemma, gpu_qwen et gpu_oss (un fournisseur par port).
    #
    # BASCULE DU 13/08 — gpt-oss-120b remplace Gemma et Qwen sur ce profil.
    # Motif : au benchmark du 10/08, Gemma 4 31B a produit ZERO des quatre
    # familles d analyse attendues. gpt-oss repond correctement en francais et
    # produit un modele de donnees Salesforce structure (verifie le 12/08).
    # Gemma et Qwen restent declares en repli, mais ne sont plus le defaut.
    # BASCULE DU 16/08 — Qwen 3.8 27B pour le premier BUILD complet.
    # gpt-oss reste declare en repli : il a produit du code Apex correct le
    # 13/08, c est le seul repere qu on ait.
    # Bascule du 19/08 : le GPU loue n existe plus, le Spark le remplace.
    orchestrator: "gpu_nemotron/nemotron"
    worker:       "gpu_nemotron/nemotron"
    fallback_chain:
      # 21/08 : les ports 18081-18083 pointaient vers le GPU loue Packet.ai,
      # eteint depuis (pay-per-use). Seul 18080 repond, via le tunnel
      # autossh VPS -> Spark. Un repli vers un port mort masquerait la panne
      # derriere un timeout de 600 s : on preferre l'erreur franche.
      "gpu_nemotron/nemotron": "gpu_nemotron/nemotron"

  on-premise:
    build_enabled: true
    orchestrator: "local/mixtral"
    worker:       "local/mistral:7b-instruct"
    fallback_chain:
      "local/mixtral":            "local/mistral-nemo"
      "local/mistral:7b-instruct": "local/mistral-nemo"
      # Pas de fallback vers anthropic/openai : exfiltration de données interdite.

  # --- Profile 3 : freemium (démo publique SaaS) ---
  # Sonnet pour tout (pas d'Opus, coûts maîtrisés). BUILD DÉSACTIVÉ (feature gate).
  freemium:
    build_enabled: false
    orchestrator: "anthropic/claude-sonnet"
    worker:       "anthropic/claude-sonnet"   # 8 juin : Haiku elimine — jamais sous Sonnet (image free tier)
    fallback_chain:
      "anthropic/claude-sonnet": "anthropic/claude-sonnet"   # no-op : aucune degradation silencieuse vers Haiku

# =============================================================================
# Providers — connexion aux APIs / endpoints
# =============================================================================
providers:
  # ── Serveur GPU dedie (Packet.ai, RTX PRO 6000 Blackwell 96 Go) ──────────
  # Ajoute le 10/08/2026. Deux modeles ouverts servis par llama.cpp, en
  # quantification 8 bits :
  #   Gemma 4 31B  (30,4 Go) — raisonnement et maniement d'outils
  #   Qwen 3.6 27B (26,6 Go) — code et sortie structuree
  # Les deux ensemble : 57 Go, il reste 39 Go pour le contexte.
  #
  # API compatible OpenAI — meme forme d'appel que le fournisseur openai.
  #
  # CE QUI NE DOIT JAMAIS Y PASSER (arbitrage Sam, 09/08) : les agents exposes
  # aux donnees clients — Sophie, Olivia, Emma, Marcus, Jordan, Aisha. Le
  # serveur est en Californie ; y router des donnees clients contredirait
  # notre argument de souverainete. Diego, Raj, Zara et Elena sont autorises :
  # ils ne voient que des metadonnees de structure (avis juridique du 09/08).
  gpu_local:
    enabled: true
    # ── ETAT MESURE LE 03/09/2026 (revue vague A, A9) ─────────────────────
    # Le bloc decrivait un monde disparu : les ports 18080-18083 visaient le
    # GPU loue Packet.ai (adresse differente a chaque location, eteint depuis
    # le 19/08), et "Gemma 4 31B" / "Qwen 3.6" n ont jamais tourne sur le
    # Spark. Pire : base_url_nemotron pointait 18080 — tenu par le tunnel
    # Packet mort — et model_id "nemotron-3-nano-30b-a3b" que vLLM refuse en
    # 404. Depuis le 31/08 (reprise de 18084 par le Spark), AUCUN appel LLM
    # de la plateforme ne pouvait aboutir. Rien ne l a signale : pas de SDS
    # lance, et un timeout de 600 s avant l erreur.
    #
    # Ce qui est REELLEMENT servi par le Spark (ssh, 03/09) :
    #   port 8001 -> VPS 18084 : vLLM, modele "nemotron-lightning"
    #                (Nemotron 3.5 Lightning NVFP4, comite + plateforme)
    #   port 8090 -> VPS 18090 : llama.cpp, Gemma 4 12B Q8 — pont linguistique
    #                UNIQUEMENT, hors routeur plateforme
    # Sur disque, NON demarres : gpt-oss-120b, qwen38-nvfp4. Ils reviennent
    # ici avec leur base_url_<nom> le jour ou un service les sert, pas avant :
    # une URL declaree sans serveur derriere est une panne differee.
    #
    # Tunnel : tunnel-spark-vllm.service (VPS -> Spark:8001, publie 0.0.0.0
    # pour que le conteneur dh-comite l atteigne via 172.19.0.1). Les ports
    # ne sont pas exposes sur internet, deliberement : vLLM n authentifie pas.
    base_url: "http://127.0.0.1:18084/v1"
    base_url_nemotron: "http://127.0.0.1:18084/v1"
    # GPU loue (Packet.ai ou autre) : adresse variable, jamais en dur ici.
    # Definir GPU_LOCAL_BASE_URL dans .env le temps de la location.
    base_url_env: "GPU_LOCAL_BASE_URL"
    api_key: "aucune"
    timeout_seconds: 600
    models:
      # ── NEMOTRON 3.5 LIGHTNING — 19/08, identifiant corrige le 03/09 ──────
      # Melange d experts : 3 milliards lus par jeton. Le goulot du Spark est
      # la bande passante memoire ; ce modele le contourne. NVIDIA le concoit
      # nommement pour cette machine.
      # Mesures du 19/08 : latence 1,4 s (7,8 s pour Qwen 27B), 42,5 jetons/s
      # (12,2), contexte 262144 natif / 131072 servi, outils 4/4.
      # POURQUOI IL EST BRANCHE ICI : le Delivery a besoin de VOLUME pour
      # valider la chaine SDS -> BUILD -> sandbox. Le tour de qualite se fera
      # ensuite, sur API.
      nemotron:
        model_id: "nemotron-lightning"      # id EXACT retourne par /v1/models
        display_name: "Nemotron 3.5 Lightning NVFP4 (Spark, local)"
        context_length: 131072
        supports_temperature: true
        port: 18084
        reasoning: false

      # ── ARCHIVES DE MESURE, modeles non servis (conserves pour l histoire) ─
      # gpt-oss-120b MXFP4 — 12/08 : 60 jetons/s, 35,7 Go. llama.cpp exige
      #   --device CUDA0 explicite (sinon CPU en silence) ; --n-cpu-moe 0 est
      #   contre-productif (1,5 jeton/s). Ecarte pour le comite le 30/08 :
      #   appels d outils 1/4, franglais.
      # Qwen 3.8 27B — 16/08 : 29 Go en Q8_0. SWE-bench Pro 61,7 (Opus 4.6 Max
      #   53,4), Terminal Bench 73,0 (78,2). Aucun de ces bancs ne teste APEX.
      #   reasoning DOIT rester false : libre, 1400 jetons de reflexion et
      #   contenu vide ; enable_thinking=false, Apex correct du premier coup.
      #   Le 30/08 sur le Spark : 4/4 aux appels d outils, JSON propre.
      # Pour les reactiver : demarrer le service sur le Spark, ajouter le
      # tunnel, puis remettre ici model_id + base_url_<nom> + port.

  ollama:
    enabled: false
    # 03/09 (A9) : passe a false. Le pipeline SDS V3 / Mistral 7B / Ollama a
    # ete supprime en aout (tag legacy/sds_v3_synthesis_before_removal) et
    # rien n ecoute sur 11434. Laisse a true, ce fournisseur etait enregistre
    # au demarrage et pouvait etre choisi par un repli : 600 s d attente pour
    # une erreur de connexion. Constate par la sonde des fournisseurs locaux.
    base_url: "http://localhost:11434"
    timeout_seconds: 300
    models:
      mistral:7b-instruct:
        context_length: 32768
        display_name: "Mistral 7B (local)"
      mistral-nemo:
        context_length: 32768
        display_name: "Mistral Nemo (local)"
      mixtral:
        context_length: 32768        # Mixtral-8x7B Instruct — orchestrator on-premise
        display_name: "Mixtral 8x7B (local)"

  anthropic:
    enabled: true
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_seconds: 600
    # MOD40 : ces model_id/flags peuvent être validés/réglés au démarrage par le
    # capability resolver (app/services/capability_resolver.py). Opt-in strict via
    # l'env DH_MOD40_CAPABILITY_RESOLVER = off (défaut) | warn | apply.
    #   warn  → loggue un WARNING si un model_id épinglé n'est plus le dernier de sa famille.
    #   apply → met aussi à jour les flags (ex. supports_temperature) depuis l'API.
    # La bascule du model_id reste TOUJOURS manuelle (décision Sam).
    models:
      claude-haiku:
        model_id: "claude-haiku-4-5-20251001"
        display_name: "Claude Haiku 4.5"
      claude-sonnet:
        model_id: "claude-sonnet-5"
        supports_temperature: false   # mod41 (2026-07-02) : Sonnet 5 — temperature deprecee (400 si envoyee), meme regime qu'Opus 4.7+. Bascule manuelle validee par Sam. Thinking adaptatif laisse ON (carte qualite).
        display_name: "Claude Sonnet 5"
      claude-opus:
        # 06/08/2026 : Opus 4.8 -> Opus 5. Verifie via GET /v1/models — claude-opus-5
        # est disponible. Regle posee par Sam : toujours la derniere version d'une
        # famille, sauf raison explicite documentee ici.
        model_id: "claude-opus-5"
        supports_temperature: false   # mod39 : Opus 4.x — sampling params (temperature/top_p/top_k) deprecies (400 si envoyes)
        display_name: "Claude Opus 5"

  openai:
    enabled: false                   # Désactivé par défaut — fallback historique, plus utilisé depuis C-1b.
    api_key_env: "OPENAI_API_KEY"
    timeout_seconds: 300
    models:
      gpt-4o:
        model_id: "gpt-4o"
        display_name: "GPT-4o"
      gpt-4o-mini:
        model_id: "gpt-4o-mini"
        display_name: "GPT-4o mini"

# =============================================================================
# Pricing — par provider/model_alias, prix per 1M tokens.
# Source de vérité pour budget_service.py.
#
# Prix Anthropic officiels (console.anthropic.com pricing page, vérifié 2026-04-25) :
#   Claude Opus 4.7     : $5  input / $25 output per 1M tokens
#   Claude Opus 4.6     : $5  input / $25 output per 1M tokens (idem 4.7)
#   Claude Sonnet 4.6   : $3  input / $15 output per 1M tokens
#   Claude Sonnet 4.5   : $3  input / $15 output per 1M tokens
#   Claude Haiku 4.5    : $1  input / $5  output per 1M tokens
# Note : le pricing $15/$75 d'Opus 4.6 (ancien Claude 3 Opus) qui figurait
# dans ce fichier était obsolète — Opus 4.x est aligné Sonnet ×~1.7 sur input
# et ×~1.7 sur output, soit $5/$25. Migré 4.6→4.7 sans changement de prix.
# =============================================================================
pricing:
  # Anthropic — prix réels vérifiés 2026-04-18
  "anthropic/claude-opus":
    input:  5.0
    output: 25.0
  "anthropic/claude-sonnet":
    input:  3.0
    output: 15.0
  "anthropic/claude-haiku":
    input:  1.0
    output: 5.0

  # Local (Ollama) — gratuit (compute on-prem)
  "local/mistral:7b-instruct":
    input:  0.0
    output: 0.0
  "local/mistral-nemo":
    input:  0.0
    output: 0.0
  "local/mixtral":
    input:  0.0
    output: 0.0

  # OpenAI — conservé pour cohérence historique (provider désactivé par défaut)
  "openai/gpt-4o":
    input:  2.5
    output: 10.0
  "openai/gpt-4o-mini":
    input:  0.15
    output: 0.6
