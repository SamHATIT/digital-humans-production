    title: "FEAT-GPU-001"
    description: "<strong>8 commit(s).</strong> <ul class=\"journal-commits\"><li><code>FIX-GREENFIELD-001</code> : un projet est vierge quand AUCUNE ORG n'est renseignee, pas quand une case a ete cochee. Regle posee par Sam le 10/08 apres avoir constate que le as_is de Marcus ne voyait aucun des 10 champs deployes le matin meme. Le type de projet etait saisi a la main dans l'assistant et jamais revu — or une org devient chargee des le premier BUILD reussi. Le mode est desormais deduit de la presence d'une org, et un ecart avec le type declare est journalise. VERIFIE : les 4 projets existants (105, 107, 108, 109) pointent tous vers une org reelle ; trois etaient declares greenfield et auraient produit un etat des lieux aveugle. Sans consequence sur une org de developpement quasi vide, redhibitoire chez un client charge — toute l'analyse d'ecart aurait ete fausse. <span class=\"sha\">293adec</span></li><li><code>FIX-PHASEMAP-002</code> + garde-fou : le vocabulaire du WBS est un contrat entre le prompt de Marcus et la table de routage. Constate sur l'execution 167 : 23 types annonces a Marcus, 20 seulement routes par le code. Les trois orphelins — dev_lwc (composant Lightning), dev_formula, doc_training — retombaient SILENCIEUSEMENT sur le repli par agent, qui fonctionne mais classe approximativement. dev_lwc etait le plus genant : c'est un livrable explicitement demande par le brief. Les trois types sont ajoutes. GARDE-FOU POSE (demande de Sam : une lecon pour l'avenir) : tools/verifier_vocabulaire_wbs.py compare les deux fichiers et liste les ecarts. Documente comme piege 11 dans PIEGES.md, avec la regle — tout type ajoute au prompt doit l'etre a la table le meme jour. <span class=\"sha\">22564b4</span></li><li><code>FIX-PERSIST-002</code> : le travail du dispositif est enfin REUTILISABLE. Methode versionner_livrables ajoutee a Jordan : elle lit l'arborescence SFDX conservee par SFAdminService et la commite avec ses chemins relatifs, reproduisant la structure dans le depot. Branchee apres chaque deploiement reussi, deliberement NON BLOQUANTE — un echec de versionnement ne doit jamais transformer un deploiement reussi en echec. VERIFIE DE BOUT EN BOUT : 11 operations, 10 composants deployes dans Salesforce, 11 fichiers conserves, commit 99dd9d8 pousse sur SamHATIT/dh-crm-salesforce, arborescence force-app/main/default/objects/Lead/fields verifiee par clonage. Le code produit est desormais relisible, corrigeable et redeployable sur une autre org — c'est ce qui distingue le dispositif d'une boite noire. <span class=\"sha\">7ed43c4</span></li><li><code>FIX-PERSIST-001</code> : les metadonnees generees sont enfin CONSERVEES. tempfile.TemporaryDirectory() effacait toute l'arborescence en sortant du bloc — les fichiers etaient deployes dans Salesforce puis DETRUITS. Rien n'atteignait jamais le depot git, ce qui explique pourquoi l'integration git n'avait jamais servi : il n'y avait rien a commiter. Les livrables sont desormais copies dans /var/lib/digital-humans/livrables/exec-&lt;id&gt;-&lt;horodatage&gt;, arborescence SFDX complete (force-app + sfdx-project.json), prete a etre versionnee par Jordan. Non bloquant : si la conservation echoue, le deploiement reussi n'est pas perdu. Verifie : 10 composants deployes, arborescence conservee. <span class=\"sha\">0feed99</span></li><li>Profil test_gpu_complet operationnel : routage verifie de bout en bout, Marcus (orchestrateur) sur Gemma, Raj et les ouvriers sur Qwen, JSON strict correct des deux cotes. Noms de fournisseurs alignes sur les cles du routeur (gpu_gemma / gpu_qwen, un fournisseur par port). <span class=\"sha\">cddc0c2</span></li><li><code>FEAT-GPU-001</code> : serveur GPU dedie branche sur la plateforme. Packet.ai RTX PRO 6000 Blackwell 96 Go, deux modeles ouverts servis par llama.cpp en quantification 8 bits — Gemma 4 31B (30,4 Go, raisonnement et outils) et Qwen 3.6 27B (26,6 Go, code et sortie structuree). 57 Go a eux deux, 39 restants pour le contexte. TROIS OBSTACLES FRANCHIS. (1) CUDA 12.6 ne connait pas Blackwell : installation de 12.8, compilation native sm_120 — la suggestion de Sam, plus propre que ma compilation en code virtuel. (2) Les ports ne sont pas exposes sur internet, deliberement : tunnel SSH permanent (service tunnel-gpu, autossh, redemarrage automatique) plutot que d'ouvrir llama.cpp qui n'a aucune authentification. (3) llama.cpp expose une API compatible OpenAI, pas celle d'Ollama : methode _call_gpu_local ajoutee, sur httpx deja present. PARTICULARITE DOCUMENTEE : Gemma 4 remplit reasoning_content avant content ; un max_tokens trop bas est entierement consomme par la reflexion et content revient VIDE. Plancher a 2000 jetons. Verifie de bout en bout : les deux modeles repondent depuis le routeur, JSON strict correct, cout zero. <span class=\"sha\">286d4de</span></li><li><code>FIX-TASKENUM-001</code> : l'enumeration taskstatus attend des valeurs en MAJUSCULES (PENDING, RUNNING, COMPLETED...). Le code ecrivait 'completed' en minuscules, ce qui levait 'invalid input value for enum taskstatus' et avortait TOUTE la transaction. Symptome : la phase restait figee en 'deploying' sans qu'aucune erreur ne remonte, et le deploiement Salesforce n'etait jamais tente. Meme symptome que <code>FIX-TASKID-001</code> du 08/08, autre cause — celui-la portait sur l'identifiant, celui-ci sur la valeur. <span class=\"sha\">3bcd757</span></li><li><code>FIX-GIT-001</code> resolu : l'integration git de la plateforme fonctionne enfin. TROIS DEFAUTS EN CHAINE, tous decouverts au premier deploiement reel. (1) Jordan appelait create_branch, commit_files, create_pr et merge_pr mais JAMAIS clone() — il travaillait dans un repertoire vide qui n'est pas un depot git. clone() pose aussi repo_path, dont toutes les operations suivantes dependent. Non bloquant : si le clonage echoue, le deploiement Salesforce continue sans versionnement. (2) _parse_repo_url utilisait urlparse, qui ne comprend PAS la syntaxe SSH git@github.com:owner/repo.git — l'adresse authentifiee devenait https://github.com/git@github.com:SamHATIT/... et GitHub repondait Repository not found. Les deux formats sont desormais acceptes, verifie sur 3 variantes. (3) Le jeton etait passe CHIFFRE a git : le commentaire du code affirmait qu'il etait stocke en clair, ce qui etait vrai en janvier mais plus depuis fevrier. Dechiffrement ajoute, avec repli sur le format ancien. VERIFIE de bout en bout : depot clone, contenu present. <span class=\"sha\">03fc6e6</span></li></ul>"

