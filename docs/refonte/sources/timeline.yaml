3476b1f</span></li><li><code>FIX-APIVERSION-001</code> : Elena rejetait tout plan sans target_api_version (checklist Summer 26), et Raj ne la declarait jamais — boucle de 3 tentatives puis echec. Deux corrections : (1) le code deployait en dur en API 59.0 alors que platform_state.yaml declare 67.0, huit versions de retard ; la version est desormais lue dans l'etat de plateforme. (2) La checklist de Raj exige maintenant target_api_version, et porte aussi les regles du suffixe __c et du conteneur Activity — dans le prompt qu'il lit vraiment, pas en commentaire YAML. <span class=\"sha\">656661c</span></li><li>GARDE-PROD-001 (suite) : le garde-fou ne recevait que le nom d'utilisateur, or ce sont les URL d'instance qui portent les marqueurs (sandbox, develop, scratch). Il refusait donc TOUT, y compris l'org de developpement — comportement correct mais inutilisable. Il interroge desormais SFDX (sf org display) pour obtenir l'instance reelle. Le message d'erreur indique l'instance interrogee. <span class=\"sha\">a5da1bb</span></li><li>Regles de sortie client etendues a TOUS les points de contact (rappel de Sam : les 11 agents sont accessibles en chat, pas seulement Sophie). Couvert : les 11 system_prompt d'agent, les 10 prompts de MODE qui ecrasaient celui de l'agent (dont le concierge public du site), et le service de chat projet qui construit son prompt en dur sans passer par les YAML. Trois chemins distincts, trois corrections. <span class=\"sha\">a73d3a6</span></li><li>Regles de sortie client posees dans le system_prompt des 11 agents (arbitrage Sam 08/08 : une regle dans le prompt plutot qu'une couche de relecture, ni cout ni complexite). Interdits : donnees d'un autre client, chemins et identifiants techniques, secrets, noms de modeles ou fournisseurs, couts et organisation interne. Obligations : langue du client, incertitude annoncee comme telle, proposer une alternative plutot que refuser, sobriete. Verifie : le PromptService charge bien la regle. <span class=\"sha\">375b66d</span></li><li>VALIDATION-XML-001 : validation Salesforce avant tout deploiement (--dry-run). Angle mort identifie par Sam : Elena relit le PLAN de Raj, mais le XML est genere APRES sa revue — les 4 echecs du 08/08 vivaient tous dans cet interstice. La validation fait verifier les metadonnees par Salesforce sans rien ecrire ; en cas d'echec, l'erreur est renvoyee telle quelle et l'org n'a pas ete touchee. Cout : un aller-retour reseau, aucun appel de modele. <span class=\"sha\">e6fd4ab</span></li><li>GARDE-PROD-001 : refus absolu de deployer en production (regle posee par Sam le 08/08). Digital-Humans livre au SANDBOX ; le client, ou un agent Agentforce chez lui, promeut ensuite. C'est une regle commerciale et contractuelle — le tier Team s'arrete explicitement au sandbox. Implemente en LISTE BLANCHE : on ne deploie que si l'org porte un marqueur de non-production (sandbox, develop, scratch, dev-ed, orgfarm, suffixe --). Toute cible non identifiable est REFUSEE. 6 cas de test dont une production Sephora et une cible inconnue. <span class=\"sha\">468228f</span></li><li>Trois correctifs de generation des metadonnees Salesforce, tous reveles par le premier deploiement reel. <code>FIX-PICKLIST-001</code> : Raj produit 'values' avec des objets, le generateur ne lisait que 'picklist_values' avec des chaines — aucun valueSet emis, Salesforce refusait. Les deux formats sont acceptes, avec label et valeur par defaut. <code>FIX-CHECKBOX-001</code> : aucune branche ne traitait le type Checkbox, or Salesforce exige defaultValue. <code>FIX-ACTIVITY-001</code> : les champs personnalises de Task et Event se deploient sur l'objet conteneur Activity, jamais directement. <span class=\"sha\">1945d6c</span></li><li><code>FIX-SUFFIXE-002</code> : la vraie cause de l'echec BUILD. sf_admin_service ajoutait __c a TOUT objet qui n'en avait pas, sans verifier s'il etait standard. Le WBS disait bien Lead ; le code deployait Lead__c, et Salesforce rejetait les 8 champs. Ni Marcus ni Raj n'etaient en cause — c'etait le code, depuis toujours. Fonction normaliser_objet() : liste des objets standard, suffixe uniquement sur les personnalises, retrait s'il a ete ajoute a tort en amont. 8 cas de test passent. <span class=\"sha\">91eb596</span></li><li><code>FIX-SUFFIXE-001</code> : regle absolue du suffixe __c posee chez Marcus (architecte) et Raj (admin). L'exec 166 a echoue au deploiement parce que le WBS demandait des champs sur Lead__c et Opportunity__c — objets STANDARD, qui ne prennent jamais le suffixe. Salesforce a rejete les 8 champs. Le schema du prompt distinguait deja standard_objects des objets personnalises, mais aucune REGLE ne l'interdisait explicitement. Marcus a desormais la liste des objets standard et les contre-exemples reels ; Raj a un garde-fou pour refuser une specification fautive avant deploiement. <span class=\"sha\">07b7eac</span></li><li><code>FIX-PHASEMAP-001</code> : le WBS de Marcus produit un vocabulaire (dev_data_model, dev_apex, dev_flow) que TASK_TYPE_TO_PHASE ne connaissait pas — elle n'attendait que l'ancien (create_object, apex_class, flow). Aucune correspondance, donc repli par agent : Diego classe en phase 2, Raj jamais atteint. Sur l'exec 166 les 7 taches de modele de donnees restaient PENDING pendant que Diego generait de l'Apex contre des objets inexistants. Detecte par Sam. 21 types ajoutes, les deux vocabulaires cohabitent. Verifie : 40/40 taches classees, phases 1 a 6 dans l'ordre. <span class=\"sha\">62202c0</span></li></ul>"

