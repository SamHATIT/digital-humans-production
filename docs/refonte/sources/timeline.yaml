port — a migrer vers un credential N8N. <span class=\"sha\">f9be4bb</span></li><li>Documentation technique : journal alimente automatiquement depuis les messages de commit (tools/journal_from_git.py) + hook post-commit qui regenere et deploie. La doc de la console d'admin etait figee au 12/07 ; aucun modele de langage n'intervient, les messages de commit portent deja la cause et l'effet. <span class=\"sha\">242e27b</span></li><li><code>FIX-TASKTYPE-001</code> (complement) : reparation des taches historiques via infer_task_type. Le correctif de persistance ne couvrait que les insertions futures ; l'execution 165 avait 40 task_type NULL et serait retombee sur le meme crash a la relance. 0 NULL apres passage. <span class=\"sha\">aa1bba7</span></li><li>Compte rendu de session 2026-08-05 : cinq taches, preuves obtenues, et ce qui reste a prouver <span class=\"sha\">c321b90</span></li><li><strong>DEC-2026-0802-03</strong> : note d'analyse sur le BUILD incremental <span class=\"sha\">c337360</span></li><li><strong>DEC-2026-0804-02</strong> : cle statut_o2 — suivi des huit chantiers du lancement <span class=\"sha\">8242763</span></li><li><strong>DEC-2026-0804-01</strong> : fiabilisation de l'export de logs du comite <span class=\"sha\">9859375</span></li><li><strong>DEC-2026-0716-02</strong> : contrat de donnees du poste de pilotage (N0/N1) <span class=\"sha\">cee403f</span></li></ul>"

